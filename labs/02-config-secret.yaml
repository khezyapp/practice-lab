# =============================================================================
# Step 02 - configuration, kept OUT of the image.
#
#   kubectl apply -f labs/02-config-secret.yaml
#
# Rule of thumb:
#   ConfigMap -> anything you would be comfortable printing in a log
#   Secret    -> anything you would not (passwords, tokens, TLS keys)
#
# This file uses `stringData` for the Secret, which is plain text and gets
# base64-encoded by the API server on write. Convenient for a lab, and a clear
# marker that you must NOT commit real credentials like this. See
# docs/concepts/09-configmaps-and-secrets.md for the production options
# (External Secrets Operator, Vault, Sealed Secrets, SOPS).
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
data:
  # --- runtime identity -----------------------------------------------------
  APP_ENV: "lab"
  LOG_LEVEL: "DEBUG"
  RELEASE: "1.0.0"

  # --- database (host = the Service name, resolved by cluster DNS) ----------
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "taskflow"
  DB_USER: "taskflow"

  # --- queue ---------------------------------------------------------------
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_QUEUE: "taskflow:jobs"

  # --- egress demo: the one external URL the API is allowed to call ---------
  # Used by GET /api/egress and enforced by the NetworkPolicy in step 09.
  EXTERNAL_API_URL: "https://api.github.com/zen"

  # --- behaviour toggles you will flip during the lab ----------------------
  # Step 10: set to "true" and the readiness probe starts requiring the DB.
  READINESS_REQUIRES_DB: "false"
  # Step 12: the cleanup CronJob deletes completed tasks older than this.
  RETENTION_DAYS: "7"

---
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secret
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  DB_PASSWORD: "labpassword"
  # Not used by the app yet - it is here so you can practise RBAC, rotation and
  # `kubectl get secret ... | base64 -d` without inventing a fake credential.
  API_TOKEN: "dev-token-change-me"
