# =============================================================================
# Step 03 - your first Pod, by hand.
#
#   kubectl apply -f labs/03-pod.yaml
#
# This is a BARE Pod: nothing manages it. It is the right tool for learning the
# mechanics and for one-off debugging, and the wrong tool for everything else.
# Step 04 replaces it with a Deployment, and the difference is the whole point of
# the exercise.
#
# A public image is used here on purpose: you build your own image in step 04, so
# this step stays focused on Pod mechanics (IP, lifecycle, ephemerality).
# =============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
  namespace: taskflow
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/component: demo
    app.kubernetes.io/part-of: taskflow
spec:
  # Graceful shutdown: the app gets SIGTERM, then this many seconds later SIGKILL.
  terminationGracePeriodSeconds: 30

  # Naming convention preserved for later steps: Pod-level security defaults.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: hello
      image: nginxdemos/hello:plain-text
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
      # Requests = what the scheduler reserves. Limits = the runtime cap.
      resources:
        requests: { cpu: "50m",  memory: "32Mi" }
        limits:   { cpu: "200m", memory: "64Mi" }
      readinessProbe:                     # "may I receive traffic?"
        httpGet: { path: /, port: http }
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:                      # "is the process still healthy?"
        httpGet: { path: /, port: http }
        initialDelaySeconds: 5
        periodSeconds: 10

# -----------------------------------------------------------------------------
# Things to notice while you work through the step:
#
# 1. There is no `replicas`, no `selector` and no update strategy - nothing owns
#    this Pod, so nothing recreates it. Delete it and it is gone forever.
#
# 2. Multi-container Pods share the network namespace. Add this under `spec` to
#    see it for yourself (both containers reach each other on localhost):
#
#      initContainers:                    # runs to completion BEFORE the app
#        - name: wait-for-something
#          image: busybox:1.36
#          command: ["sh","-c","sleep 3; echo pre-flight done"]
#      containers:
#        - name: log-sidecar              # runs ALONGSIDE the app
#          image: busybox:1.36
#          command: ["sh","-c","while true; do echo sidecar tick; sleep 30; done"]
#
# 3. `kubectl port-forward pod/hello-pod 8080:80` reaches it without a Service.
#    That works - and it is not how production traffic flows (see step 05).
# -----------------------------------------------------------------------------
