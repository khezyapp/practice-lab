# Runs the built VitePress site (see Dockerfile) as a long-lived service.
#
#   docker compose up -d --build     # start / rebuild
#   docker compose logs -f docs      # follow
#   docker compose down              # stop
#
# The site is then on http://localhost:3100

services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: practice-lab-docs:latest
    container_name: practice-lab-docs
    restart: unless-stopped
    ports:
      - "3100:80"
