# nginx config for the built VitePress site.
#
# VitePress emits real .html files (cleanUrls is off in the site config), so the
# only thing nginx has to do is serve them and fall back to the site's own 404.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve /page as well as /page.html so links keep working if cleanUrls is
    # turned on later.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed filenames — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # VitePress generates 404.html; serve it for anything that misses.
    error_page 404 /404.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;
}
